<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notebook</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app" class="hidden">
    <div id="backdrop"></div>

    <div id="notebook">

      <!-- Sidebar: list of notes -->
      <div id="sidebar">
        <div id="sidebar-header">
          <span class="title">My Notebook</span>
          <button id="newNoteBtn" title="New note">+ New</button>
        </div>
        <div id="notesList"></div>
        <div id="notesCount"></div>
      </div>

      <!-- Editor -->
      <div id="editor">
        <div id="editor-header">
          <input id="titleInput" maxlength="40" placeholder="Note title...">
          <div id="editor-actions">
            <button id="deleteBtn" class="danger hidden">Delete</button>
            <button id="saveBtn" class="primary">Save</button>
            <button id="closeBtn" title="Close (Esc)">&times;</button>
          </div>
        </div>
        <textarea id="contentInput" maxlength="2000" placeholder="Write something..."></textarea>
        <div id="editor-footer">
          <span id="charCount">0 / 2000</span>
          <span id="statusMsg"></span>
        </div>
      </div>

    </div>
  </div>

  <!-- Delete confirmation modal -->
  <div id="confirmModal" class="hidden">
    <div class="confirm-box">
      <h3>Delete Note</h3>
      <p>Are you sure you want to delete this note? This cannot be undone.</p>
      <div class="confirm-actions">
        <button id="confirmCancel">Cancel</button>
        <button id="confirmDelete" class="danger">Delete</button>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
